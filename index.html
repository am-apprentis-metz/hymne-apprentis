<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hymne des Apprentis — Accès</title>
<style>
:root{
  --paper:#ead4a5; --paper2:#f3e2bd; --ink:#2b1b10;
  --gold:#b98a35; --burgundy:#4b1111; --line:#8b6328;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#3a0909;color:var(--ink);font-family:Georgia,serif}
body{
  background:
    radial-gradient(circle at 50% 20%,rgba(255,235,185,.12),transparent 42%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.015) 0 2px,transparent 2px 7px),
    var(--burgundy);
}
.page{min-height:100vh;padding:22px 12px;display:flex;align-items:center;justify-content:center}
.card{
  width:min(720px,100%); min-height:calc(100vh - 44px);
  padding:34px 24px 28px; position:relative; overflow:hidden;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.35),transparent 35%),
    repeating-linear-gradient(0deg,rgba(105,70,20,.025) 0 1px,transparent 1px 4px),
    var(--paper);
  border:3px solid var(--gold);
  box-shadow:0 0 0 6px #6f3f18, inset 0 0 45px rgba(90,45,10,.18), 0 18px 55px #180303;
}
.card:before{content:"";position:absolute;inset:10px;border:1px solid #9a6b28;pointer-events:none}
h1{
  margin:20px 0 8px;text-align:center;font-size:clamp(32px,7vw,58px);
  letter-spacing:.02em;font-weight:900;
}
.ornament{width:170px;margin:0 auto 28px;display:flex;align-items:center;gap:8px}
.ornament:before,.ornament:after{content:"";height:1px;background:#79501f;flex:1}
.ornament span{font-size:24px}
.instruction{text-align:center;font-size:clamp(19px,4.5vw,27px);line-height:1.45;margin:0 auto 20px;max-width:600px}
.small{text-align:center;opacity:.72;font-size:14px;margin:0 auto 14px}
.canvas-wrap{max-width:520px;margin:0 auto;position:relative}
canvas{
  width:100%;aspect-ratio:1.55;display:block;touch-action:none;
  background:rgba(255,245,214,.36);border:2px solid #98703a;
  box-shadow:inset 0 0 25px rgba(80,45,10,.10);
}
.buttons{display:flex;justify-content:center;gap:10px;margin:14px 0 4px}
button{
  border:1px solid #79501f;background:#ead09b;color:#2b1b10;
  padding:10px 18px;font:600 16px Georgia,serif;cursor:pointer;
}
button:active{transform:translateY(1px)}
.status{text-align:center;min-height:34px;font-size:19px;margin-top:12px}
.success{color:#4d3514;font-weight:700}
.fail{color:#6c1812}
#reveal{display:none;opacity:0}
#reveal.show{display:block;animation:reveal .9s ease forwards}
.sigma{font-size:70px;text-align:center;margin:12px 0 2px}
.recognized{text-align:center;font-size:clamp(26px,7vw,42px);letter-spacing:.09em;font-weight:900}
.hymne{display:block;width:100%;height:auto;margin:18px auto 0;border:1px solid #8b6328;box-shadow:0 8px 28px rgba(50,20,0,.25)}
@keyframes reveal{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:480px){.page{padding:12px 8px}.card{min-height:calc(100vh - 24px);padding:28px 14px 22px}.card:before{inset:7px}.instruction{font-size:20px}}
</style>
</head>
<body>
<div class="page">
<main class="card">
  <section id="gate">
    <h1>Hymne des Apprentis</h1>
    <div class="ornament"><span>✦</span></div>
    <p class="instruction">Pour accéder à l'Hymne, dessinez le symbole des Apprentis</p>
    <p class="small">À toi de jouer, camarade.</p>
    <div class="canvas-wrap"><canvas id="pad"></canvas></div>
    <div class="buttons"><button id="clear">Effacer</button><button id="check">Valider le symbole</button></div>
    <div id="status" class="status"></div>
  </section>

  <section id="reveal">
    <div class="sigma">Σ</div>
    <div class="recognized">SIGMA RECONNU</div>
    <img class="hymne" src="hymne-des-apprentis.png" alt="Hymne des Apprentis">
  </section>
</main>
</div>

<script>
const canvas=document.getElementById('pad'), ctx=canvas.getContext('2d');
let dpr=1, drawing=false, strokes=[], current=[];
function resize(){
  const r=canvas.getBoundingClientRect(); dpr=Math.max(1,devicePixelRatio||1);
  canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='#2b1b10';
  redraw();
}
function pt(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function redraw(){
  const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);
  ctx.strokeStyle='#2b1b10';ctx.lineWidth=5;
  for(const s of strokes.concat(current.length?[current]:[])){if(s.length<2)continue;ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);ctx.stroke()}
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;current=[pt(e)];canvas.setPointerCapture(e.pointerId);redraw()});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();current.push(pt(e));redraw()});
function end(){if(!drawing)return;drawing=false;if(current.length>2)strokes.push(current);current=[];redraw()}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
document.getElementById('clear').onclick=()=>{strokes=[];current=[];document.getElementById('status').textContent='';redraw()};

// Recognition: tolerant geometric test for a hand-drawn uppercase Sigma.
function recognizeSigma(){
  const all=strokes.flat();
  if(all.length<25)return false;

  // =========================================================
  // 1. BOUNDING BOX
  // =========================================================
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;

  for(const p of all){
    minX=Math.min(minX,p.x);
    minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x);
    maxY=Math.max(maxY,p.y);
  }

  const w=maxX-minX;
  const h=maxY-minY;

  if(w<55||h<55)return false;

  const aspect=w/h;

  // Un Sigma majuscule est généralement plus large que haut,
  // mais on laisse une bonne tolérance pour le dessin au doigt.
  if(aspect<0.65||aspect>2.1)return false;

  // Normalisation 0 → 1
  const pts=all.map(p=>({
    x:(p.x-minX)/w,
    y:(p.y-minY)/h
  }));

  // =========================================================
  // 2. REJET DES FORMES FERMÉES
  //    Rond, carré, boucle, sigma minuscule arrondi...
  // =========================================================
  for(const s of strokes){

    if(s.length<10)continue;

    const a=s[0];
    const b=s[s.length-1];

    const d=Math.hypot(b.x-a.x,b.y-a.y);

    if(d/w<0.13){
      return false;
    }
  }

  // =========================================================
  // 3. GRILLE DU DESSIN
  // =========================================================
  const W=60;
  const H=60;
  const grid=new Uint8Array(W*H);

  for(const p of pts){

    const x=Math.round(p.x*(W-1));
    const y=Math.round(p.y*(H-1));

    for(let yy=-2;yy<=2;yy++){
      for(let xx=-2;xx<=2;xx++){

        const X=x+xx;
        const Y=y+yy;

        if(X>=0&&X<W&&Y>=0&&Y<H){
          grid[Y*W+X]=1;
        }
      }
    }
  }

  // =========================================================
  // OUTILS
  // =========================================================

  function ink(x,y,r=2){

    const cx=Math.round(x*(W-1));
    const cy=Math.round(y*(H-1));

    for(let yy=-r;yy<=r;yy++){
      for(let xx=-r;xx<=r;xx++){

        const X=cx+xx;
        const Y=cy+yy;

        if(X>=0&&X<W&&Y>=0&&Y<H&&grid[Y*W+X]){
          return true;
        }
      }
    }

    return false;
  }

  function lineScore(x1,y1,x2,y2){

    let hit=0;
    const steps=80;

    for(let i=0;i<=steps;i++){

      const t=i/steps;

      const x=x1+(x2-x1)*t;
      const y=y1+(y2-y1)*t;

      if(ink(x,y,3)){
        hit++;
      }
    }

    return hit/(steps+1);
  }

  function horizontalScore(y){

    let hit=0;
    const steps=70;

    for(let i=0;i<=steps;i++){

      const x=i/steps;

      if(ink(x,y,3)){
        hit++;
      }
    }

    return hit/(steps+1);
  }

  function density(x1,x2,y1,y2){

    let total=0;
    let hit=0;

    const xa=Math.floor(x1*W);
    const xb=Math.ceil(x2*W);
    const ya=Math.floor(y1*H);
    const yb=Math.ceil(y2*H);

    for(let y=ya;y<yb;y++){
      for(let x=xa;x<xb;x++){

        total++;

        if(grid[y*W+x]){
          hit++;
        }
      }
    }

    return total?hit/total:0;
  }

  // =========================================================
  // 4. LE Σ DOIT AVOIR 4 EXTRÉMITÉS
  //
  //       ─────────
  //              \
  //               \
  //               /
  //              /
  //       ─────────
  // =========================================================

  const TL=density(0,.32,0,.20);
  const TR=density(.68,1,0,.20);

  const BL=density(0,.32,.80,1);
  const BR=density(.68,1,.80,1);

  if(TL<.025||TR<.025||BL<.025||BR<.025){
    return false;
  }

  // =========================================================
  // 5. LES DEUX LIGNES HORIZONTALES
  // =========================================================

  const top=horizontalScore(.10);
  const bottom=horizontalScore(.90);

  // Le haut et le bas doivent réellement traverser
  // une grande partie de la largeur.
  if(top<.27)return false;
  if(bottom<.27)return false;

  // =========================================================
// 5 BIS. REJET DES CROIX "X"
// =========================================================

function horizontalCoverage(y){

  const zones=[
    [0,.30],
    [.35,.65],
    [.70,1]
  ];

  let count=0;

  for(const [x1,x2] of zones){

    let hit=0;
    const steps=30;

    for(let i=0;i<=steps;i++){

      const t=i/steps;
      const x=x1+(x2-x1)*t;

      if(ink(x,y,3)){
        hit++;
      }
    }

    if(hit/(steps+1)>.18){
      count++;
    }
  }

  return count;
}

const topCoverage=horizontalCoverage(.10);
const bottomCoverage=horizontalCoverage(.90);

if(topCoverage<3||bottomCoverage<3){
  return false;
}
  
  // =========================================================
  // 6. LE CENTRE DU Σ
  // =========================================================

  if(density(.35,.65,.38,.62)<.015){
    return false;
  }

  // =========================================================
  // 7. LES DEUX DIAGONALES
  //
  // On teste plusieurs variantes afin d'accepter un Σ
  // dessiné de manière irrégulière.
  // =========================================================

  const diagonalA =
    (lineScore(.88,.12,.50,.50) +
     lineScore(.50,.50,.12,.88))/2;

  const diagonalB =
    (lineScore(.12,.12,.50,.50) +
     lineScore(.50,.50,.88,.88))/2;

  const diagonal=Math.max(diagonalA,diagonalB);

  if(diagonal<.26){
   return false;
 }

  // =========================================================
  // 8. IMPORTANT :
  //    LE MILIEU GAUCHE ET LE MILIEU DROIT
  //    DOIVENT RESTER relativement VIDES.
  //
  // Cela élimine notamment les ronds, ovales et σ.
  // =========================================================

  const leftMiddle=density(0,.28,.25,.75);
  const rightMiddle=density(.72,1,.25,.75);

  if(leftMiddle>.18||rightMiddle>.18){
    return false;
  }

  // =========================================================
  // 9. LE Σ NE DOIT PAS ÊTRE UNE FORME ARRONDIE
  //
  // On vérifie qu'il existe bien un changement de direction
  // autour du centre.
  // =========================================================

  const upperDiagonal =
    Math.max(
      lineScore(.85,.12,.50,.50),
      lineScore(.15,.12,.50,.50)
    );

  const lowerDiagonal =
    Math.max(
      lineScore(.50,.50,.15,.88),
      lineScore(.50,.50,.85,.88)
    );

  if(upperDiagonal<.28||lowerDiagonal<.28){
  return false;
 }

  // =========================================================
  // 10. REJET DES SIGMAS MINUSCULES ARRONDIS
  //
  // Un σ possède généralement beaucoup d'encre dans la
  // partie centrale basse et sur les côtés.
  // =========================================================

  const centralLower=density(.25,.75,.55,.85);

  const centralUpper=density(.25,.75,.15,.45);

  if(centralLower>.32&&centralUpper>.32){
    return false;
  }

  // =========================================================
  // 11. SCORE FINAL
  // =========================================================

  const score =
      top*0.25 +
      bottom*0.25 +
      diagonal*0.30 +
      upperDiagonal*0.10 +
      lowerDiagonal*0.10;

  return score>=0.37;
}
document.getElementById('check').onclick=()=>{
  const status=document.getElementById('status');
  if(recognizeSigma()){
    status.className='status success';status.textContent='SIGMA RECONNU';
    document.getElementById('gate').style.display='none';
    const r=document.getElementById('reveal');r.style.display='block';requestAnimationFrame(()=>r.classList.add('show'));
    window.scrollTo({top:0,behavior:'smooth'});
  }else{
    status.className='status fail';status.textContent='Le symbole n’est pas reconnu. Réessayez, camarade.';
  }
};
new ResizeObserver(resize).observe(canvas);
resize();
</script>
</body>
</html>
