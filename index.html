<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hymne des Apprentis</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(circle at center, #ead7ad 0%, #c9a66b 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Georgia, serif;
        color: #3d2418;
    }

    .page {
        width: min(92vw, 900px);
        min-height: 90vh;
        margin: 20px;
        padding: 35px 25px;
        background:
            linear-gradient(rgba(245,226,180,.94), rgba(224,195,137,.94));
        border: 10px solid #641d29;
        box-shadow:
            0 0 0 3px #c49a48,
            0 10px 30px rgba(0,0,0,.35);
        text-align: center;
        position: relative;
    }

    h1 {
        margin: 5px 0 25px;
        font-size: clamp(28px, 6vw, 52px);
        color: #641d29;
        font-family: Georgia, serif;
        letter-spacing: 1px;
    }

    .instruction {
        font-size: clamp(20px, 4vw, 30px);
        font-weight: bold;
        margin: 20px 0 18px;
    }

    .subtitle {
        font-size: 15px;
        opacity: .7;
        margin-bottom: 15px;
    }

    canvas {
        display: block;
        width: min(100%, 600px);
        height: 360px;
        margin: 0 auto;
        background: rgba(255,248,224,.65);
        border: 3px solid #641d29;
        border-radius: 10px;
        touch-action: none;
        cursor: crosshair;
    }

    .buttons {
        margin-top: 15px;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        background: #641d29;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        opacity: .9;
    }

    #message {
        min-height: 35px;
        margin-top: 18px;
        font-weight: bold;
        font-size: 20px;
    }

    #hymne {
        display: none;
        margin-top: 30px;
    }

    #hymne img {
        max-width: 100%;
        height: auto;
        border: 4px solid #641d29;
        box-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    .success {
        color: #641d29;
        font-size: 28px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="page">

    <h1>Hymne des Apprentis</h1>

    <div class="instruction">
        À toi de jouer, camarade
    </div>

    <div class="subtitle">
        <!-- Aucun indice sur le symbole -->
    </div>

    <canvas id="canvas"></canvas>

    <div class="buttons">
        <button id="clear">Effacer</button>
        <button id="validate">Valider</button>
    </div>

    <div id="message"></div>

    <div id="hymne">
        <div class="success">SIGMA RECONNU</div>
        <br>
        <img src="hymne-des-apprentis.png" alt="Hymne des Apprentis">
    </div>

</div>

<script>

/* =========================================================
   CANVAS
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;
let points = [];

function resizeCanvas() {

    const rect = canvas.getBoundingClientRect();

    const ratio = window.devicePixelRatio || 1;

    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;

    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#641d29";
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================================================
   DESSIN
   ========================================================= */

function getPosition(e) {

    const rect = canvas.getBoundingClientRect();

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

canvas.addEventListener("pointerdown", function(e) {

    drawing = true;

    points = [];

    const p = getPosition(e);

    points.push(p);

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);

    canvas.setPointerCapture(e.pointerId);
});


canvas.addEventListener("pointermove", function(e) {

    if (!drawing) return;

    const p = getPosition(e);

    points.push(p);

    ctx.lineTo(p.x, p.y);
    ctx.stroke();
});


canvas.addEventListener("pointerup", function() {

    drawing = false;
    ctx.closePath();
});


canvas.addEventListener("pointercancel", function() {

    drawing = false;
});


/* =========================================================
   EFFACER
   ========================================================= */

document.getElementById("clear").addEventListener("click", function() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    points = [];

    document.getElementById("message").textContent = "";

    document.getElementById("hymne").style.display = "none";
});


/* =========================================================
   OUTILS DE RECONNAISSANCE
   ========================================================= */

function distance(a, b) {

    const dx = a.x - b.x;
    const dy = a.y - b.y;

    return Math.sqrt(dx * dx + dy * dy);
}


function pathLength(points) {

    let total = 0;

    for (let i = 1; i < points.length; i++) {

        total += distance(
            points[i - 1],
            points[i]
        );
    }

    return total;
}


function resample(points, n) {

    if (points.length < 2) return points;

    const totalLength = pathLength(points);

    if (totalLength === 0) return points;

    const interval = totalLength / (n - 1);

    let D = 0;

    const newPoints = [points[0]];

    let previous = points[0];

    let i = 1;

    while (i < points.length) {

        const current = points[i];

        const d = distance(previous, current);

        if ((D + d) >= interval) {

            const ratio = (interval - D) / d;

            const q = {
                x: previous.x + ratio * (current.x - previous.x),
                y: previous.y + ratio * (current.y - previous.y)
            };

            newPoints.push(q);

            previous = q;

            D = 0;

        } else {

            D += d;
            previous = current;
            i++;
        }
    }

    while (newPoints.length < n) {

        newPoints.push(points[points.length - 1]);
    }

    return newPoints;
}


function boundingBox(points) {

    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;

    for (const p of points) {

        minX = Math.min(minX, p.x);
        minY = Math.min(minY, p.y);

        maxX = Math.max(maxX, p.x);
        maxY = Math.max(maxY, p.y);
    }

    return {
        minX,
        minY,
        maxX,
        maxY,
        width: maxX - minX,
        height: maxY - minY
    };
}


function normalize(points) {

    const box = boundingBox(points);

    const size = Math.max(box.width, box.height);

    if (size === 0) return points;

    return points.map(p => ({

        x: (p.x - box.minX) / size,

        y: (p.y - box.minY) / size

    }));
}


/* =========================================================
   SIGMA DE RÉFÉRENCE
   ========================================================= */

/*
   Plusieurs modèles sont utilisés afin d'accepter
   différentes façons naturelles de dessiner le Sigma.
*/

const templates = [

    [
        {x:0.95,y:0.05},
        {x:0.65,y:0.05},
        {x:0.35,y:0.05},
        {x:0.05,y:0.05},
        {x:0.35,y:0.35},
        {x:0.65,y:0.65},
        {x:0.95,y:0.95},
        {x:0.65,y:0.95},
        {x:0.35,y:0.95},
        {x:0.05,y:0.95}
    ],

    [
        {x:0.05,y:0.05},
        {x:0.95,y:0.05},
        {x:0.50,y:0.50},
        {x:0.95,y:0.95},
        {x:0.05,y:0.95}
    ],

    [
        {x:0.95,y:0.05},
        {x:0.10,y:0.05},
        {x:0.50,y:0.50},
        {x:0.10,y:0.95},
        {x:0.95,y:0.95}
    ]

];


/* =========================================================
   COMPARAISON
   ========================================================= */

function averageDistance(a, b) {

    const n = Math.min(a.length, b.length);

    if (n === 0) return Infinity;

    let total = 0;

    for (let i = 0; i < n; i++) {

        total += distance(a[i], b[i]);
    }

    return total / n;
}


function reversePoints(points) {

    return [...points].reverse();
}


function similarityToTemplate(input, template) {

    const a = normalize(
        resample(input, 64)
    );

    const b = normalize(
        resample(template, 64)
    );

    const direct = averageDistance(a, b);

    const reversed = averageDistance(
        a,
        reversePoints(b)
    );

    return Math.min(direct, reversed);
}


/* =========================================================
   VALIDATION
   ========================================================= */

document.getElementById("validate").addEventListener("click", function() {

    const message = document.getElementById("message");

    if (points.length < 15) {

        message.textContent =
            "Le symbole n'est pas reconnu. Réessayez, camarade.";

        document.getElementById("hymne").style.display = "none";

        return;
    }

    const box = boundingBox(points);

    /*
       On évite les dessins minuscules ou presque horizontaux.
    */

    if (
        box.width < 40 ||
        box.height < 40
    ) {

        message.textContent =
            "Le symbole n'est pas reconnu. Réessayez, camarade.";

        document.getElementById("hymne").style.display = "none";

        return;
    }


    let bestScore = Infinity;

    for (const template of templates) {

        const score = similarityToTemplate(
            points,
            template
        );

        bestScore = Math.min(
            bestScore,
            score
        );
    }


    /*
       Seuil volontairement permissif.

       Plus le nombre est élevé,
       plus la reconnaissance est tolérante.
    */

    const THRESHOLD = 0.38;


    if (bestScore < THRESHOLD) {

        message.textContent = "";

        document.getElementById("hymne").style.display = "block";

        document.getElementById("hymne").scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    } else {

        message.textContent =
            "Le symbole n'est pas reconnu. Réessayez, camarade.";

        document.getElementById("hymne").style.display = "none";
    }

});

</script>

</body>
</html>
